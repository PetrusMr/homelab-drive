<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Perfil</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar">
        <h1>HOMELAB IWR</h1>
        <a href="{{ url_for('user.perfil') }}" class="btn-back">Voltar</a>
    </nav>
    
    <div class="editar-container">
        <div class="editar-card">
            <h2>Editar Perfil</h2>
            
            <form method="POST" enctype="multipart/form-data" class="editar-form">
                <div class="form-group">
                    <label for="usuario">Nome de Usuário:</label>
                    <input type="text" id="usuario" name="usuario" value="{{ usuario.usuario }}" required>
                </div>
                
                <div class="form-group">
                    <label for="imagem">Foto de Perfil:</label>
                    <input type="file" id="imagem" name="imagem" accept="image/*" onchange="loadImageEditor(event)">
                    <small>Formatos aceitos: PNG, JPG, JPEG, GIF</small>
                    
                    <!-- Editor de Imagem -->
                    <div id="image-editor" class="image-editor" style="display: none;">
                        <div class="editor-preview">
                            <div class="crop-container">
                                <img id="preview-image" src="" alt="Preview">
                                <div class="crop-overlay"></div>
                            </div>
                        </div>
                        
                        <div class="editor-controls">
                            <div class="control-group">
                                <label>Zoom:</label>
                                <input type="range" id="zoom-slider" min="0.5" max="3" step="0.1" value="1">
                                <span id="zoom-value">100%</span>
                            </div>
                            
                            <div class="control-group">
                                <label>Rotação:</label>
                                <input type="range" id="rotate-slider" min="0" max="360" step="15" value="0">
                                <span id="rotate-value">0°</span>
                            </div>
                            
                            <div class="control-group">
                                <label>Posição X:</label>
                                <input type="range" id="position-x" min="-100" max="100" step="5" value="0">
                            </div>
                            
                            <div class="control-group">
                                <label>Posição Y:</label>
                                <input type="range" id="position-y" min="-100" max="100" step="5" value="0">
                            </div>
                            
                            <div class="editor-buttons">
                                <button type="button" onclick="resetImage()">Reset</button>
                                <button type="button" onclick="applyChanges()">Aplicar</button>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="form-group">
                    <h3>Alterar Senha (opcional)</h3>
                    <label for="senha_atual">Senha Atual:</label>
                    <input type="password" id="senha_atual" name="senha_atual">
                </div>
                
                <div class="form-group">
                    <label for="nova_senha">Nova Senha:</label>
                    <input type="password" id="nova_senha" name="nova_senha">
                </div>
                
                <!-- Campo oculto para dados da imagem editada -->
                <input type="hidden" id="image-data" name="image_data">
                
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Salvar Alterações</button>
                    <a href="{{ url_for('user.perfil') }}" class="btn btn-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
    
    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <div class="flash-messages">
                {% for message in messages %}
                    <div class="flash-message">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}
    
    <script src="{{ url_for('static', filename='js/image-editor.js') }}"></script>
</body>
</html>
